name: melo_beat
description: "MeloBeat - A modern Material 3 audio player app for local music playback."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Material Design Icons
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Audio Playback
  audioplayers: ^6.1.0

  # Query local audio files
  on_audio_query: ^2.9.0

  # Permission handling
  permission_handler: ^11.3.1

  # HTTP for API calls
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/melobeat_logo.jpeg

